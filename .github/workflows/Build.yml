name: Build HakiOS for Moto G84 (bangkk)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build G84 kernel and payload
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm flex bison m4 perl python3 autoconf automake libtool \
            git curl xz-utils zstd cpio device-tree-compiler libssl-dev libxml2-dev qemu-system-arm

      - name: Set up Theos and the iPhoneOS toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          THEOS: /home/runner/theos
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/.git" ]; then
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          if [ ! -d "$THEOS/toolchain/linux/iphone/bin" ]; then
            mkdir -p "$THEOS/toolchain"
            gh release download --repo L1ghtmann/llvm-project --pattern 'iOSToolchain.tar.xz' --dir /tmp --clobber
            tar -xf /tmp/iOSToolchain.tar.xz -C "$THEOS/toolchain"
            rm -f /tmp/iOSToolchain.tar.xz
          fi
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld64" ] && [ ! -x "$THEOS/toolchain/linux/iphone/bin/ld" ]; then
            echo "No ld64 found in $THEOS/toolchain/linux/iphone/bin"
            find "$THEOS/toolchain" -maxdepth 5 -type f | head -40
            exit 1
          fi

      - name: Configure the Moto G84
        run: make moto-g84_defconfig

      - name: Build kernel
        run: make kernel JOBS="$(nproc)"

      - name: Build open loader and hello ramdisk
        run: make loader-open hello

      - name: Create G84 payload
        run: |
          set -euo pipefail
          mkdir -p out
          CONFIG_ARGS="$(python3 tools/hakios-config.py args --defconfig moto-g84_defconfig)"
          SOC_ARGS="$(tr '\n' ' ' < devices/moto-g84/soc.args)"
          xnuloader/mkpayload.py -o out/hakios-bangkk-payload.bin \
            kernel=hakios-kernel ramdisk=userland/hello \
            --cmdline "$CONFIG_ARGS $SOC_ARGS"
          sha256sum out/hakios-bangkk-payload.bin > out/hakios-bangkk-payload.bin.sha256

      - name: Explain the remaining device-specific inputs
        run: |
          {
            echo '## Moto G84 build artifacts'
            echo
            echo 'The G84 kernel, open loader, hello ramdisk, and XNUP payload were built and are attached to this run.'
            echo
            echo 'A complete Android boot image is not produced yet: it needs the G84-specific BootShim, Silicium UEFI, ramdisk, and mkbootimg.py. The workflow does not substitute Moto G85 firmware.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-bangkk
          path: |
            out/hakios-bangkk-payload.bin
            out/hakios-bangkk-payload.bin.sha256
            hakios-kernel
            xnuloader/loader.efi
            userland/hello
            .config
          if-no-files-found: error
          retention-days: 14
